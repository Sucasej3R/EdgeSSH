name = "edgessh"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
workers_dev = true
preview_urls = false

# 模板默认使用用户自己的 workers.dev 地址，避免绑定原作者的域名。
# Actions 可通过 CUSTOM_DOMAIN 配置自定义域名。

[build]
command = "npm run build:web"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
CONNECT_TIMEOUT_MS = "10000"

[[durable_objects.bindings]]
name = "SSH_SESSIONS"
class_name = "SSHSessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SSHSessionDO"]

[[d1_databases]]
binding = "DB"
database_name = "edgessh-accounts"
database_id = "1e6f60c2-b19c-45e4-b8f2-1d4ceea12bda"
migrations_dir = "migrations"
